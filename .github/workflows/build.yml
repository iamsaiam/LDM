name: Diagnose macOS transfers
on:
  push:
    branches: ['diagnostics/macos-transfers']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfers:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Build native diagnostic executables
        run: |
          brew install cmake curl
          export CURL_ROOT="$(brew --prefix curl)"
          cmake -S cpp-engine -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-release --parallel 3
          otool -L build-release/LDM.app/Contents/MacOS/LDM
      - name: Bounded transfer checks with native process samples
        run: |
          python3 -u - <<'PY'
          import os, pathlib, signal, subprocess, sys
          root = pathlib.Path.cwd()
          build = root / 'build-release'
          wrapper = "import faulthandler,runpy,sys; faulthandler.dump_traceback_later(12, repeat=True); sys.argv=sys.argv[1:]; runpy.run_path(sys.argv[0],run_name='__main__')"
          cases = [('http_pause_test.py',build/'ldm-engine-features-driver'),('http_controls_inspection_test.py',build/'LDM.app/Contents/MacOS/LDM')]
          failures = []
          for name, binary in cases:
              print('\nCASE',name,flush=True)
              process = subprocess.Popen([sys.executable,'-u','-c',wrapper,str(root/'cpp-engine/tests'/name),str(binary)],start_new_session=True)
              try:
                  code = process.wait(timeout=28)
                  if code: failures.append((name,code))
              except subprocess.TimeoutExpired:
                  listing = subprocess.check_output(['ps','-axo','pid=,command='],text=True)
                  for line in listing.splitlines():
                      fields = line.strip().split(None,1)
                      if len(fields)!=2 or not fields[1].startswith(str(build)+'/'): continue
                      pid = fields[0]
                      output = pathlib.Path(os.environ['RUNNER_TEMP']) / ('ldm-sample-'+pid+'.txt')
                      result = subprocess.run(['sample',pid,'1','-file',str(output)],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=10)
                      print(result.stdout,flush=True)
                      if output.exists(): print(output.read_text()[:45000],flush=True)
                  failures.append((name,'timeout'))
              finally:
                  try: os.killpg(process.pid,signal.SIGKILL)
                  except ProcessLookupError: pass
                  process.wait()
          print('FAILURES',failures,flush=True)
          if failures: raise SystemExit(1)
          PY
